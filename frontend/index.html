<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121215" />
    <meta name="description" content="Kip, a companion that remembers you and can look things up." />
    <title>Kip</title>
  </head>
  <body>
    <a class="skip-link" href="#chat-input">Skip to message box</a>
    <div class="app">
      <header class="topbar">
        <div class="identity">
          <div class="monogram" aria-hidden="true"><span id="kip-monogram">K</span></div>
          <div class="identity-text">
            <h1 id="kip-name">Kip</h1>
            <p class="mood" id="kip-mood"><span class="mood-dot" aria-hidden="true"></span><span id="kip-mood-text">Your companion</span></p>
          </div>
        </div>
        <div class="status-group">
          <span class="status-pill" id="model-pill" data-state="pending" title="Language model">
            <span class="dot" aria-hidden="true"></span><span id="model-status">Checking model…</span>
          </span>
          <span class="status-pill" id="connection-pill" data-state="pending" role="status">
            <span class="dot" aria-hidden="true"></span><span id="connection">Connecting…</span>
          </span>
          <button id="panel-toggle" class="icon-button" type="button" aria-controls="side-panel" aria-expanded="true" aria-label="Toggle side panel" title="Toggle side panel">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14.5 4.5v15" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
        </div>
      </header>

      <div class="shell">
        <main class="conversation" aria-label="Conversation with Kip">
          <div id="chat-scroll" class="chat-scroll">
            <section id="chat-empty" class="empty-state" aria-labelledby="empty-title">
              <div class="empty-monogram" aria-hidden="true"><span>K</span></div>
              <h2 id="empty-title">Hi, I’m <span class="kip-name">Kip</span>.</h2>
              <p>I remember what you tell me, and I can look things up on the web or work something out in Python.</p>
              <div class="suggestions" aria-label="Suggestions">
                <button type="button" class="suggestion" data-say="Hi Kip, how are you?">Hi Kip, how are you?</button>
                <button type="button" class="suggestion" data-say="What do you remember about me?">What do you remember about me?</button>
                <button type="button" class="suggestion" data-say="What's the latest cricket score?">What’s the latest cricket score?</button>
              </div>
            </section>
            <div id="chat-log" class="chat-log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Messages"></div>
          </div>
          <button id="jump-latest" class="jump-latest" type="button" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14m0 0-6-6m6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            New messages
          </button>
          <div class="composer-wrap">
            <p id="error" class="composer-note" role="alert" hidden></p>
            <form id="chat-form" class="composer">
              <label class="sr-only" for="chat-input">Message <span class="kip-name">Kip</span></label>
              <textarea id="chat-input" rows="1" maxlength="1000" placeholder="Message Kip…" autocomplete="off" enterkeyhint="send"></textarea>
              <button id="chat-send" class="send-button" type="submit" aria-label="Send message" title="Send">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </form>
            <p class="composer-hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line</p>
          </div>
        </main>

        <aside id="side-panel" class="side-panel" aria-label="Details">
          <div class="panel-head">
            <div class="tabs" role="tablist" aria-label="Details">
              <button type="button" class="tab" id="tab-memories" role="tab" aria-selected="true" aria-controls="memories-panel">About you</button>
              <button type="button" class="tab" id="tab-persona" role="tab" aria-selected="false" aria-controls="persona-panel" tabindex="-1"><span class="kip-name">Kip</span></button>
              <button type="button" class="tab" id="tab-activity" role="tab" aria-selected="false" aria-controls="activity-panel" tabindex="-1">Activity</button>
            </div>
            <button id="panel-close" class="icon-button panel-close" type="button" aria-label="Close panel" title="Close">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div id="memories-panel" class="panel-body" role="tabpanel" aria-labelledby="tab-memories" tabindex="0"></div>
          <div id="persona-panel" class="panel-body" role="tabpanel" aria-labelledby="tab-persona" tabindex="0" hidden></div>
          <div id="activity-panel" class="panel-body" role="tabpanel" aria-labelledby="tab-activity" tabindex="0" hidden></div>
        </aside>
        <div id="scrim" class="scrim" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
